<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>(Inter_Links)</title>
    <link rel="stylesheet" href="../main.principal/styles(2).css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <div class="video-background">
        <video autoplay muted loop playsinline>
          <source
            src="../assets/Videos/background-video(2).mp4"
            type="video/mp4"
          />
        </video>
      </div>
    </header>
    <main>
      <br />
      <div class="PagNav">
        <b><h4>Cursos💼</h4></b>
      </div>
      <br />

      <li id="center">
        <div class="itens">
          <img
            src="../assets/Isei-Logo.jpg"
            alt="I-Sei_LOGO"
            class="Isei-img"
          />
          <a href="https://jornada.isei.app/" target="_blank">I-Sei</a>
        </div>
        <div class="itens">
          <img
            src="../assets/IAAcademy-Logo.jpg"
            alt="IAad_LOGO"
            class="IAAcademy-img"
          />
          <a href="https://iacademy.astronmembers.com/dashboard" target="_blank"
            >IA-Academy</a
          >
        </div>
      </li>

      <br />
      <section>
        <div class="PagNav">
          <b><h4>IA's🤖</h4></b>
          <br />
          <a class="NavButton" href="../main.principal/index.html">Anterior</a>
        </div>
      </section>
      <br />
      <li id="center">
        <div class="itens">
          <img
            src="../assets/KlingAI-Logo.jpg"
            alt="KlingAI_LOGO"
            class="KlingAI-img"
          />
          <a
            href="https://app.klingai.com/global/image-to-video/frame-mode/new?ra=4"
            target="_blank"
            >KlingAI</a
          >
        </div>
        <div class="itens">
          <img
            src="../assets/DeepSeek-Logo.jpg"
            alt="DeepSeek_LOGO"
            class="DeepSeek-img"
          />
          <a href="https://chat.deepseek.com/" target="_blank">DeepSeek</a>
        </div>
        <div class="itens">
          <img
            src="../assets/BlackBoxAI-Logo.jpg"
            alt="BlackBoxAI_LOGO"
            class="BlackBoxAI-img"
          />
          <a
            href="https://agcommunity.design-time.eu10.apps.build.cloud.sap/"
            target="_blank"
            >BlackBox_AI</a
          >
        </div>
      </li>
    </main>

    <script src="../main.principal/javascript.js"></script>

    <div class="chat-ai-container">
      <img
        src="../assets/Tiago(AI).png"
        alt="Tiago_AI"
        class="chat-ai-icon"
        id="chatAiIcon"
      />
      <div class="chat-popup" id="chatAiPopup">
        <div class="chat-header">
          <h3>Tiago_AI 🤖</h3>
          <button
            id="resetChatBtn"
            class="reset-chat-btn"
            title="Limpar Histórico"
          >
            🗑
          </button>
          <span class="close-btn" id="closeChatBtn">×</span>
        </div>
        <div class="chat-window" id="chatWindow"></div>
        <div class="chat-input-area">
          <input
            type="text"
            id="userInput"
            placeholder="Digite sua mensagem..."
          />
          <button id="sendButton">Enviar</button>
        </div>
      </div>
    </div>

    <div class="reset-popup-overlay" id="resetPopupOverlay">
      <div class="reset-popup-content">
        <h4>Limpar Histórico de Conversa?</h4>
        <p>Tem certeza de que deseja apagar todo o histórico de mensagens?</p>
        <div class="reset-popup-buttons">
          <button id="cancelResetBtn" class="cancel-btn">Não</button>
          <button id="confirmResetBtn" class="confirm-btn">Sim</button>
        </div>
      </div>
    </div>

    <script src="../chat-ai/chat.js"></script>
  </body>
</html>
